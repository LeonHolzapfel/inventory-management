services:
  web:
    image: nginx:alpine
    container_name: school-inventory
    ports:
      - "8080:80"
    volumes:
      -
  db:
    image: mysql
    container_name: db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${HOST_PORT}:9443"
    volumes:
      - ./src/Backend/Database/script.sql:/docker-entrypoint-initdb.d